version: 2

sources:
  - name: thelook_ecommerce
    database: bigquery-public-data
    schema: thelook_ecommerce
    tables:
      - name: orders
      - name: order_items
      - name: users
      - name: products
      - name: events

  - name: raw
    database: "{{ env_var('DBT_GCP_PROJECT', 'shoppulse-511205') }}"
    schema: raw
    tables:
      - name: holidays
        description: Public holidays loaded daily from the Nager.Date API by the Airflow DAG (delete-then-insert by year).

  - name: ml
    database: "{{ env_var('DBT_GCP_PROJECT', 'shoppulse-511205') }}"
    schema: "{{ env_var('DBT_GCP_DATASET', 'shoppulse_dev') }}"
    tables:
      - name: churn_scores
        description: Churn probabilities written by ml/train.py (RandomForest), overwritten each DAG run.
